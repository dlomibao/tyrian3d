<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music debug</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; background: #111; color: #ddd; margin: 16px; }
      button, select, input { font: inherit; margin: 2px; }
      #status { margin-top: 8px; color: #9c9; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Tyrian music (dev only)</h1>
    <p>Plays music.mus from the dev server's /tyrian-data/. Click anywhere first so audio can start.</p>
    <div>
      <select id="song"></select>
      <button id="play">Play</button>
      <button id="restart">Restart</button>
      <button id="stop">Stop</button>
      <button id="fade">Fade</button>
      <label>Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="1" /></label>
    </div>
    <div id="status"></div>
    <script type="module" src="./debugMusic.ts"></script>
  </body>
</html>
